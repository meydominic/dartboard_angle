name: Deploy PWA to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Inject release version
        run: |
          VERSION="${{ github.ref_name }}"
          # Strip leading 'v' if present (e.g. v0.1.0 → 0.1.0)
          VERSION="${VERSION#v}"
          echo "{\"version\": \"$VERSION\"}" > assets/version.json
          echo "App version set to: $VERSION"

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate Riverpod code
        run: dart run build_runner build

      - name: Build web
        run: flutter build web --base-href /

      - name: Add CNAME for custom domain
        run: echo "dartboard-angle.apps.meydom.dev" > build/web/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
